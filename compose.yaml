name: unified-insurance-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-insurance_platform}
      POSTGRES_USER: ${POSTGRES_USER:-insurance_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [platform]

  document-processing-layer:
    build:
      context: services/document-processing-layer
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-insurance_platform}:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/${POSTGRES_DB:-insurance_platform}
      DEVICE: cpu
      BLUR_LAPLACIAN_THRESHOLD: ${BLUR_LAPLACIAN_THRESHOLD:-100}
      CONFIDENCE_THRESHOLD: ${DOCUMENT_CONFIDENCE_THRESHOLD:-0.80}
      LLM_POST_CORRECTION_ENABLED: ${LLM_POST_CORRECTION_ENABLED:-false}
      LLM_POST_CORRECTION_URL: ${LLM_POST_CORRECTION_URL:-http://insurance-vlm:8000}
      LLM_POST_CORRECTION_API_KEY: ${VLM_API_KEY:-local-vlm-key}
      LLM_POST_CORRECTION_TIMEOUT_SECONDS: ${LLM_POST_CORRECTION_TIMEOUT_SECONDS:-180}
      # Production templates are registered by the approval workflow, not seeded here.
      SEED_DEFAULT_TEMPLATE: ${SEED_DEFAULT_TEMPLATE:-false}
    volumes:
      - generated_documents:/app/storage
      - ./runtime/document-crops:/app/storage/crops
      - ./runtime/document-preprocessed-crops:/app/storage/preprocessed_crops
      - ./runtime/document-line-crops:/app/storage/line_crops
      - document_models:/app/models_weights
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 8
    restart: unless-stopped
    networks: [platform]

  visual-field-detection:
    build:
      context: services/visual-field-detection
      dockerfile: Dockerfile
    environment:
      DATA_ROOT: /data
      MODEL_DIR: /models/pp_doclayout_v3_epoch29_deployment_v1
      TABLE_CELL_MODEL_DIR: /models/RT-DETR-L_wired_table_cell_det
      DATABASE_URL: postgresql://${POSTGRES_USER:-insurance_platform}:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/${POSTGRES_DB:-insurance_platform}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      MAX_PAGES: ${MAX_PAGES:-10}
      CPU_THREADS: ${LAYOUT_CPU_THREADS:-4}
      PADDLE_RUN_MODE: ${PADDLE_RUN_MODE:-auto}
    volumes:
      - visual_field_data:/data
      - layout_models:/models:ro
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      start_period: 60s
      retries: 8
    restart: unless-stopped
    networks: [platform]

  ocr-fastapi-service:
    build:
      context: services/ocr-fastapi-service
      dockerfile: Dockerfile
    environment:
      TESSERACT_CMD: /usr/bin/tesseract
      DEBUG_MODE: "false"
    volumes:
      - ocr_artifacts:/app/artifacts
    ports:
      - "8003:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 8
    restart: unless-stopped
    networks: [platform]

  insurance-vlm:
    build:
      context: .
      dockerfile: docker/insurance-vlm.Dockerfile
    environment:
      VLM_ENGINE: ${VLM_ENGINE:-mock}
      VLM_POST_CORRECTION_PROVIDER: ${VLM_POST_CORRECTION_PROVIDER:-disabled}
      GOOGLE_CLOUD_PROJECT: ${GEMINI_GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GEMINI_GOOGLE_CLOUD_LOCATION:-global}
      GEMINI_POST_CORRECTION_MODEL: ${GEMINI_POST_CORRECTION_MODEL:-gemini-3.5-flash}
      GOOGLE_APPLICATION_CREDENTIALS: /var/secrets/google/application_default_credentials.json
      VLM_MODEL_ID: ${VLM_MODEL_ID:-Qwen/Qwen3-VL-2B-Instruct}
      VLM_LLAMA_URL: ${VLM_LLAMA_URL:-http://127.0.0.1:8081}
      VLM_LLAMA_MODEL: ${VLM_LLAMA_MODEL:-Qwen/Qwen3-VL-4B-Instruct-GGUF:Q4_K_M}
      VLM_LLAMA_TIMEOUT_SECONDS: ${VLM_LLAMA_TIMEOUT_SECONDS:-900}
      VLM_API_KEY: ${VLM_API_KEY:-local-vlm-key}
      VLM_JOBS_DIR: /var/lib/insurance-vlm/jobs
      VLM_MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      VLM_WORKERS: "1"
      VLM_PRELOAD_MODEL: "false"
      VLM_MAX_NEW_TOKENS: ${VLM_MAX_NEW_TOKENS:-900}
      VLM_IMAGE_MIN_PIXELS: ${VLM_IMAGE_MIN_PIXELS:-65536}
      VLM_IMAGE_MAX_PIXELS: ${VLM_IMAGE_MAX_PIXELS:-131072}
    volumes:
      - vlm_jobs:/var/lib/insurance-vlm/jobs
      - ${GOOGLE_APPLICATION_CREDENTIALS_HOST_PATH:-./.credentials/application_default_credentials.json}:/var/secrets/google/application_default_credentials.json:ro
    ports:
      - "8004:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 8
    restart: unless-stopped
    networks: [platform]

  orchestrator:
    build:
      context: .
      dockerfile: docker/orchestrator.Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-insurance_platform}:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/${POSTGRES_DB:-insurance_platform}
      ORCHESTRATOR_STORAGE_ROOT: /data/artifacts
      DOCUMENT_PROCESSING_URL: ${DOCUMENT_PROCESSING_URL:-http://document-processing-layer:8000}
      VISUAL_FIELD_URL: ${VISUAL_FIELD_URL:-http://visual-field-detection:8000}
      OCR_URL: ${OCR_URL:-http://ocr-fastapi-service:8000}
      INSURANCE_VLM_URL: ${INSURANCE_VLM_URL:-http://insurance-vlm:8000}
      VLM_API_KEY: ${VLM_API_KEY:-local-vlm-key}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-300}
      RETRY_ATTEMPTS: ${RETRY_ATTEMPTS:-3}
      RETRY_BACKOFF_SECONDS: ${RETRY_BACKOFF_SECONDS:-0.25}
      VLM_POLL_INTERVAL_SECONDS: ${VLM_POLL_INTERVAL_SECONDS:-0.5}
      VLM_POLL_TIMEOUT_SECONDS: ${VLM_POLL_TIMEOUT_SECONDS:-180}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      ALLOWED_UPLOAD_EXTENSIONS: ${ALLOWED_UPLOAD_EXTENSIONS:-.pdf,.png,.jpg,.jpeg,.webp,.tif,.tiff}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173}
    volumes:
      - orchestrator_artifacts:/data/artifacts
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      document-processing-layer:
        condition: service_healthy
      visual-field-detection:
        condition: service_healthy
      ocr-fastapi-service:
        condition: service_healthy
      insurance-vlm:
        condition: service_healthy
    restart: unless-stopped
    networks: [platform]

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: .
    ports:
      - "3000:80"
    depends_on:
      orchestrator:
        condition: service_healthy
    restart: unless-stopped
    networks: [platform]

  frontend-dev:
    image: node:20-alpine
    profiles: [frontend-dev]
    working_dir: /frontend
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    volumes:
      - ./burmese-ocr-system-UI:/frontend
      - frontend_node_modules:/frontend/node_modules
    ports:
      - "5173:5173"
    networks: [platform]

  frontend-prototype-backend:
    build:
      context: .
      dockerfile: docker/frontend-prototype-backend.Dockerfile
    profiles: [frontend-standalone]
    volumes:
      - prototype_runtime:/app/backend/runtime_data
    ports:
      - "8005:8000"
    networks: [platform]

  insurance-vlm-gpu:
    build:
      context: .
      dockerfile: docker/insurance-vlm-gpu.Dockerfile
    profiles: [gpu]
    environment:
      VLM_ENGINE: qwen
      VLM_MODEL_ID: ${VLM_MODEL_ID:-Qwen/Qwen3-VL-2B-Instruct}
      VLM_API_KEY: ${VLM_API_KEY:-local-vlm-key}
      VLM_JOBS_DIR: /var/lib/insurance-vlm/jobs
      VLM_WORKERS: "1"
      VLM_PRELOAD_MODEL: ${VLM_PRELOAD_MODEL:-true}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /models/huggingface
    volumes:
      - vlm_gpu_jobs:/var/lib/insurance-vlm/jobs
      - vlm_models:/models
    ports:
      - "18004:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks: [platform]

  model-loader:
    image: alpine:3.21
    profiles: [tools]
    command: sh -c "cp -a /source/. /models/ && find /models -maxdepth 2 -type d -print"
    volumes:
      - ${LAYOUT_MODEL_SOURCE:-./models}:/source:ro
      - layout_models:/models
    networks: [platform]

networks:
  platform:
    internal: false

volumes:
  postgres_data:
  generated_documents:
  document_models:
  visual_field_data:
  layout_models:
  ocr_artifacts:
  vlm_jobs:
  orchestrator_artifacts:
  frontend_node_modules:
  prototype_runtime:
  vlm_gpu_jobs:
  vlm_models:
